[package]
name = "microkit-http-server-example-server"
version = "0.1.0"
authors = ["Nick Spinale <nick.spinale@coliasgroup.com>"]
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
async-unsync = { version = "0.3.0", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["async-await", "alloc"] }
log = "0.4.28"
microkit-http-server-example-server-core = { path = "core", features = [] }
one-shot-mutex = "0.2.1"
rtcc = "0.4.0"
sddf = { path = "../../../../../experimental/sddf" }
sddf-async-block-io = { path = "../../../../../experimental/sddf/async/block-io" }
sddf-smoltcp = { path = "../../../../../experimental/sddf/smoltcp" }
sel4 = { path = "../../../../../sel4", features = ["exposed-state", "non-thread-local-state"] }
sel4-async-block-io = { path = "../../../../../sel4-async/block-io" }
sel4-async-block-io-cached = { path = "../../../../../sel4-async/block-io/cached" }
sel4-async-block-io-disk = { path = "../../../../../sel4-async/block-io/disk" }
sel4-async-network = { path = "../../../../../sel4-async/network" }
sel4-async-time = { path = "../../../../../sel4-async/time" }
sel4-driver-interfaces = { path = "../../../../../experimental/sel4-driver-interfaces" }
sel4-immediate-sync-once-cell = { path = "../../../../../sel4-immediate-sync-once-cell" }
sel4-logging = { path = "../../../../../sel4-logging" }
sel4-microkit = { path = "../../../../../sel4-microkit", features = ["alloc"] }
sel4-never-polyfill = { path = "../../../../../sel4-never-polyfill" }

[dependencies.sel4-async-single-threaded-executor]
path = "../../../../../sel4-async/single-threaded-executor"

[dependencies.sel4-microkit-driver-adapters]
path = "../../../../../experimental/sel4-microkit/driver-adapters"

[dependencies.sel4-newlib]
path = "../../../../../experimental/sel4-newlib"
features = ["detect-libc", "link-libc", "link-libnosys", "all-symbols"]

[dependencies.smoltcp]
version = "0.14.0"
default-features = false
features = [
    "proto-ipv4",
    "proto-dhcpv4",
    "proto-dns",
    "socket-dhcpv4",
    "socket-dns",
    "socket-tcp",
    "log",
]

[build-dependencies]
rcgen = "0.14.5"
